<!doctype html>
<!--
  Rendered output of Pricing.aspx + AngularHost.Master.

  This file is byte-for-byte what the browser would receive from the ASPX
  page in legacy-host/reference/ — server-side directives resolved, values
  HTML-encoded. Everything below the <body> is the actual integration
  contract between the legacy application and the Angular platform.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Customer Pricing — LegacyWeb</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/ui/shell/current/styles.css" />
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #fafafa; }
      .legacy-chrome {
        background: #26374a; color: #fff; padding: 0.75rem 1.25rem;
        display: flex; align-items: center; gap: 1.5rem;
      }
      .legacy-chrome strong { font-size: 1rem; }
      .legacy-chrome a { color: #9fd3ff; font-size: 0.875rem; }
      .legacy-note {
        margin: 1rem; padding: 0.75rem 1rem; border-left: 3px solid #26374a;
        background: #fff; color: #444; font-size: 0.875rem; max-width: 52rem;
      }
    </style>
  </head>
  <body>
    <!-- Existing legacy page chrome, unchanged by the migration -->
    <div class="legacy-chrome">
      <strong>LegacyWeb</strong>
      <a href="/Reports.asp">Reports (classic ASP, unmigrated)</a>
      <a href="/Admin.aspx">Admin (existing ASPX)</a>
    </div>

    <p class="legacy-note">
      This page is served by the legacy application. Everything below is rendered
      by a federated Angular feature loaded at runtime through the manifest.
    </p>

    <!--
      AngularPageContent placeholder. The {{...}} tokens stand for the ASPX
      <%= %> expressions in legacy-host/reference/Pricing.aspx; server.js
      substitutes them with HTML-encoded values exactly as the code-behind does.
    -->
    <main id="angular-page-host" data-angular-feature="pricing">
      <ca-pricing-page customer-id="{{CustomerId}}"></ca-pricing-page>
    </main>

    <script type="application/json" id="angular-bootstrap-context">
      {{BootstrapContextJson}}
    </script>

    <!--
      The shell reference from AngularHost.Master.

      Native Federation installs the shared-dependency import map at runtime
      through es-module-shims, so the shell entry must be loaded as
      "module-shim", not "module". A plain type="module" script bypasses the
      shim and every bare Angular specifier fails to resolve.
    -->
    <script type="esms-options">{ "shimMode": true }</script>
    <script type="module" src="/ui/shell/current/polyfills.js"></script>
    <script type="module-shim" src="/ui/shell/current/main.js"></script>
  </body>
</html>
